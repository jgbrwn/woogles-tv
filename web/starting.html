<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Woogles-TV is starting</title>
<link rel="icon" href="/static/wtv2-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/app.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Mulish, sans-serif; display: flex; align-items: center;
    justify-content: center; text-align: center; overflow: hidden; }
  main { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 16px; max-width: 900px; }
  h1 { font: 800 min(5vmin, 34px)/1.2 Mulish, sans-serif; margin: 0 0 1.4vmin; }
  h1 .dots::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .detail { font-size: min(2.8vmin, 18px); color: var(--muted); font-weight: 600; min-height: 1.4em; margin: 0; }
  .slow { font-size: min(2.6vmin, 17px); color: var(--ink); font-weight: 600; margin: 2vmin 0 0; padding: 1.2vmin 2vmin;
    border-radius: 1.4vmin; background: var(--card); max-width: 36em; }
  .steps { display: flex; gap: 3.4vmin; margin: 5vmin 0 0; padding: 0; list-style: none; font-size: min(2.5vmin, 16px);
    font-weight: 700; color: var(--muted); flex-wrap: wrap; justify-content: center; }
  .steps li { display: flex; align-items: center; gap: 1vmin; }
  .steps li::before { content: ''; width: 1.1em; height: 1.1em; border-radius: 50%; border: .18em solid var(--line); box-sizing: border-box; }
  .steps li.now { color: var(--ink); }
  .steps li.now::before { border-color: var(--primary) var(--primary) var(--line) var(--line); animation: spin .9s linear infinite; }
  .steps li.done::before { content: '✓'; border: 0; background: var(--primary); color: var(--primary-ink); font-size: .8em;
    width: 1.4em; height: 1.4em; display: flex; align-items: center; justify-content: center; font-weight: 900; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wtGlow"></div>
<main>
  <div class="wtArt">
  <div class="wtBrand"><div class="logo"><span class="w">W</span>oogles<span class="tv">-TV</span></div><img class="appIcon" src="/static/wtv2-icon.svg" alt=""></div>
  <div class="wtTiles" aria-hidden="true"><span style="--i:0">W<sub>4</sub></span><span style="--i:1">O<sub>1</sub></span><span style="--i:2">O<sub>1</sub></span><span style="--i:3">G<sub>2</sub></span><span style="--i:4">L<sub>1</sub></span><span style="--i:5">E<sub>1</sub></span><span style="--i:6">S<sub>1</sub></span></div>
  </div>
  <h1 id="label" role="status" aria-live="polite">Starting up<span class="dots"></span></h1>
  <p class="detail" id="detail">Woogles-TV is getting ready. This page opens the game by itself.</p>
  <p class="slow hidden" id="slow"></p>
  <ul class="steps" id="steps">
    <li data-k="lists">Word lists</li>
    <li data-k="rooms">Saved games</li>
    <li data-k="extras">Announcer</li>
  </ul>
</main>
<script src="/static/starting.js"></script>
</body>
</html>
