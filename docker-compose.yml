# Everything in Docker (docs/DEPLOY.md option B).
#   docker compose up -d                       → the game server on http://<host>:8420/
# With the announcer's server voice (docs/TTS.md), which adds the speech engine as a second service:
#   tts/fetch-models.sh                        # once, first
#   uncomment WT_TTS_URL below, then: docker compose --profile tts up -d
# The Dockerfile builds only the game server; the speech engine is a ready-made image, defined in
# tts/docker-compose.yml (that file on its own is for game servers that are not in Docker).
services:
  woogles-tv:
    build: .
    image: woogles-tv
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      # The URL phones use to reach this server; it is what the QR code on the TV encodes.
      # Leave empty to derive it from each request (fine behind a proxy that sets X-Forwarded-Host/Proto).
      PUBLIC_URL: ""   # e.g. https://woogles-tv.example.com
      # CAST_APP_ID: ABCD1234   # optional, see docs/CAST.md
      # WT_TTS_URL: http://tts:8431   # server voice, needs the tts profile
      # WT_TTS_VOICES: cosette,caro_davy,anna,azelma,charles,eve,fantine,jane,marius,mary,michael,paul,peter_yearsley,stuart_bell,vera
    volumes:
      - rooms:/app/data/rooms     # saved rooms/games (survive upgrades)
  tts:
    # Optional server voice for the announcer. Defined once in tts/docker-compose.yml (image, limits, config);
    # here it only joins this project, under the "tts" profile, without publishing a port: woogles-tv reaches it
    # over the Compose network at http://tts:8431.
    profiles: ["tts"]
    extends:
      file: tts/docker-compose.yml
      service: tts
    ports: !reset []
volumes:
  rooms:
