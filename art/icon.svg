  </defs><rect width="512" height="512" rx="112" fill="url(#bg)"/><rect width="512" height="512" rx="112" fill="url(#sheen)"/><g transform="translate(256 256) scale(1) translate(-256 -256)">  <g filter="url(#drop)">
    <!-- feet -->
